<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackageVerse</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #0a0a0c;
  color: #e0e0e6;
  min-height: 100vh;
}
.header {
  padding: 16px 24px;
  border-bottom: 1px solid #1e1e24;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 1.1rem;
  font-weight: 600;
  color: #8b5cf6;
}
.header .status {
  font-size: 0.75rem;
  color: #6b7280;
}
.main {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 57px);
}
.sidebar {
  border-right: 1px solid #1e1e24;
  overflow-y: auto;
  padding: 16px;
}
.sidebar h2 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #6b7280;
  margin-bottom: 12px;
}
.app-card {
  padding: 12px;
  border-radius: 8px;
  background: #131318;
  border: 1px solid #1e1e24;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.app-card:hover {
  border-color: #8b5cf6;
}
.app-card.active {
  border-color: #8b5cf6;
  background: #1a1525;
}
.app-card .name {
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 2px;
}
.app-card .title {
  font-size: 0.7rem;
  color: #6b7280;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-card .meta {
  font-size: 0.65rem;
  color: #4b5563;
  margin-top: 4px;
}
.park-btn {
  margin-top: 8px;
  padding: 6px 12px;
  border-radius: 6px;
  background: #8b5cf6;
  color: white;
  border: none;
  font-size: 0.75rem;
  cursor: pointer;
  width: 100%;
}
.park-btn:hover { background: #7c3aed; }
.park-btn:disabled { background: #374151; cursor: not-allowed; }
.viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
}
.viewer-empty {
  color: #4b5563;
  font-size: 0.9rem;
  text-align: center;
}
.viewer-empty .icon {
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: 0.3;
}
.stream-container {
  position: relative;
  max-width: 100%;
  max-height: 100%;
}
.stream-container img {
  max-width: 100%;
  max-height: calc(100vh - 120px);
  border-radius: 8px;
  border: 1px solid #1e1e24;
  cursor: crosshair;
  display: block;
}
.stream-overlay {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.7);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.7rem;
  color: #8b5cf6;
}
.stream-controls {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.stream-controls input {
  padding: 6px 10px;
  border-radius: 6px;
  background: #131318;
  border: 1px solid #1e1e24;
  color: #e0e0e6;
  font-size: 0.8rem;
  width: 200px;
}
.stream-controls button {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  font-size: 0.75rem;
  cursor: pointer;
}
.btn-send { background: #8b5cf6; color: white; }
.btn-stop { background: #dc2626; color: white; }
.parked-section {
  margin-top: 24px;
}
.parked-card {
  padding: 10px;
  border-radius: 8px;
  background: #0f1510;
  border: 1px solid #1a3320;
  margin-bottom: 6px;
  cursor: pointer;
}
.parked-card:hover { border-color: #22c55e; }
.parked-card .name { font-size: 0.8rem; color: #22c55e; }
.parked-card .meta { font-size: 0.65rem; color: #4b5563; margin-top: 2px; }
</style>
</head>
<body>
<div class="header">
  <h1>PackageVerse</h1>
  <div class="status" id="status">connecting...</div>
</div>
<div class="main">
  <div class="sidebar">
    <h2>Running Apps</h2>
    <div id="appList"></div>
    <div class="parked-section">
      <h2>Parked (Web-Accessible)</h2>
      <div id="parkedList"></div>
    </div>
  </div>
  <div class="viewer" id="viewer">
    <div class="viewer-empty">
      <div class="icon">&#128187;</div>
      <div>Select a running app from the left<br>and click Park to make it web-accessible</div>
    </div>
  </div>
</div>

<script>
let currentParkId = null;
let refreshTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

async function loadApps() {
  const data = await api('/api/apps');
  const list = document.getElementById('appList');
  list.innerHTML = '';
  for (const app of data.apps) {
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <div class="name">${app.name}</div>
      <div class="title">${app.window_title || '(no title)'}</div>
      <div class="meta">PID ${app.pid} &middot; ${app.window_bounds.w}x${app.window_bounds.h}</div>
      <button class="park-btn" onclick="parkApp(${app.window_id})">Park</button>
    `;
    list.appendChild(card);
  }
  document.getElementById('status').textContent = `${data.apps.length} apps running`;
}

async function loadParked() {
  const data = await api('/api/parked');
  const list = document.getElementById('parkedList');
  list.innerHTML = '';
  for (const p of data.parked) {
    const card = document.createElement('div');
    card.className = 'parked-card';
    card.onclick = () => viewParked(p.park_id);
    card.innerHTML = `
      <div class="name">${p.app.name}</div>
      <div class="meta">${p.click_count} clicks &middot; ${p.key_count} keys &middot; ${p.frame_age_ms}ms old</div>
    `;
    list.appendChild(card);
  }
}

async function parkApp(windowId) {
  const data = await api('/api/park', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({window_id: windowId})
  });
  if (data.park_id) {
    viewParked(data.park_id);
    loadParked();
  } else {
    alert(data.error || 'Failed to park');
  }
}

function viewParked(parkId) {
  currentParkId = parkId;
  const viewer = document.getElementById('viewer');
  viewer.innerHTML = `
    <div class="stream-container">
      <img id="streamImg" src="/api/parked/${parkId}/stream" alt="stream"
           onclick="handleClick(event)"
           oncontextmenu="return false;" />
      <div class="stream-overlay" id="overlay">live</div>
    </div>
    <div class="stream-controls">
      <input type="text" id="typeInput" placeholder="type text..."
             onkeydown="if(event.key==='Enter') sendType()" />
      <button class="btn-send" onclick="sendType()">Send</button>
      <button class="btn-stop" onclick="stopPark()">Unpark</button>
    </div>
  `;
}

function handleClick(event) {
  if (!currentParkId) return;
  const img = event.currentTarget;
  const rect = img.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;
  api(`/api/parked/${currentParkId}/click`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({x: x, y: y})
  });
}

async function sendType() {
  if (!currentParkId) return;
  const input = document.getElementById('typeInput');
  const text = input.value;
  if (!text) return;
  await api(`/api/parked/${currentParkId}/type`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: text})
  });
  input.value = '';
}

async function stopPark() {
  if (!currentParkId) return;
  await api(`/api/parked/${currentParkId}/stop`, {method: 'POST'});
  currentParkId = null;
  document.getElementById('viewer').innerHTML = `
    <div class="viewer-empty">
      <div class="icon">&#128187;</div>
      <div>Select a running app from the left<br>and click Park to make it web-accessible</div>
    </div>
  `;
  loadParked();
}

// Refresh app list and parked list every 3 seconds
refreshTimer = setInterval(() => {
  loadApps();
  loadParked();
}, 3000);

// Initial load
loadApps();
loadParked();
</script>
</body>
</html>
