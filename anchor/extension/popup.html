<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a14;
      color: #c8c8e0;
      margin: 0;
    }
    h2 { font-size: 16px; margin: 0 0 12px; }
    h2 span { color: #e84855; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status.connected { background: rgba(16,185,129,.15); color: #10b981; }
    .status.disconnected { background: rgba(102,102,128,.15); color: #666680; }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .status.connected .dot { background: #10b981; }
    .status.disconnected .dot { background: #666680; }
    .info { font-size: 12px; color: #666680; margin-bottom: 12px; line-height: 1.5; }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(80,80,120,.15);
    }
    .data-row .label { color: #666680; }
    .data-row .value { font-family: 'SF Mono', Monaco, monospace; color: #c8c8e0; }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
    }
    .btn-primary { background: #7c6ce0; color: #fff; }
    .btn-ghost { background: transparent; color: #c8c8e0; border: 1px solid rgba(80,80,120,.25); }
  </style>
</head>
<body>
  <h2>Masseur<span>Boost</span> Bridge</h2>

  <div class="status disconnected" id="status-box">
    <span class="dot"></span>
    <span id="status-text">Not connected</span>
  </div>

  <div class="info">
    This extension connects your RentMasseur tab to the MasseurBoost dashboard.
    It reads visitor counts, detects login state, and inserts approved bios.
  </div>

  <div id="data-section" style="display:none">
    <div class="data-row">
      <span class="label">RM Login</span>
      <span class="value" id="rm-login">—</span>
    </div>
    <div class="data-row">
      <span class="label">Visitors</span>
      <span class="value" id="rm-visitors">—</span>
    </div>
    <div class="data-row">
      <span class="label">Profile</span>
      <span class="value" id="rm-profile">—</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-connect">Connect to Dashboard</button>
  <button class="btn btn-ghost" id="btn-extract">Extract RM Data Now</button>

  <script src="popup.js"></script>
</body>
</html>
